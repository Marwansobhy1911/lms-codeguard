[project]
name = "codeguard"
version = "0.1.0"
description = "Enterprise Source Code Plagiarism Detection System"
authors = [{ name = "Yousef", email = "yousefd4704@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-c>=0.21.0",
    "tree-sitter-cpp>=0.21.0",
    "SQLAlchemy>=2.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pluggy>=1.4.0",
    "pygments>=2.17.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "plugins"]
