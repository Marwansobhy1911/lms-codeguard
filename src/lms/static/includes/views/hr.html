<!-- HR VIEW -->
            <div id="hr-view" class="view-section">
                <!-- HR UNASSIGNED STUDENTS PANEL (Max 50 Capacity) -->

                <div class="grid-2" style="margin-bottom: 24px;">
                    <!-- Attendance Management -->
                    <div class="glass-card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
                            <h3 style="color: var(--accent-purple);" data-i18n="hr_attendance_title">📊 إدارة حضور وغياب الطلاب</h3>
                            <div style="display: flex; gap: 8px;">
                                <span id="hr-students-count-badge" class="badge badge-hr">الطلاب المسندين: --</span>
                                <span id="hr-present-count-badge" class="badge" style="background: rgba(52, 211, 153, 0.2); color: #34d399;">الحضور: 0</span>
                            </div>
                        </div>
                        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px;" data-i18n="hr_attendance_sub">قم برصد الحضور والغياب للطلاب المسندين إليك لكل سيشن يدويًا عبر التشيك بوكس، أو عبر رفع شيت الإكسيل.</p>



                        <!-- Manual Attendance List with Checkboxes -->
                        <h4 style="margin-bottom: 10px; font-size: 0.95rem; color: var(--accent-cyan);" data-i18n="hr_manual_title">✍️ رصد الغياب يدويًا للسيشن</h4>
                        
                        <div class="form-group">
                            <label data-i18n="label_select_session_manual">اختر السيشن المراد رصد غيابها:</label>
                            <select id="hr-manual-session-select" style="margin-bottom: 12px;">
                                <option value="">-- اختر السيشن --</option>
                            </select>
                        </div>

                        <!-- NEW QUICK ID ATTENDANCE FORM -->
                        <div style="margin-bottom: 24px; padding: 16px; background: rgba(59, 130, 246, 0.05); border: 1px dashed rgba(59, 130, 246, 0.4); border-radius: 12px;">
                            <h5 style="margin-bottom: 8px; color: var(--accent-blue);">⚡ تسجيل سريع للطالب بالـ ID</h5>
                            <form onsubmit="handleQuickIdAttendance(event, 'present')" style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                                <input type="text" id="hr-quick-id-input" placeholder="اكتب ID الطالب واضغط Enter أو تسجيل..." required style="flex: 1; min-width: 120px; font-size: 0.9rem; padding: 10px; border-radius: 8px; border: 1px solid var(--border-card); background: rgba(0,0,0,0.2); color: white;">
                                <button type="submit" class="btn btn-primary" style="white-space: nowrap; min-height: 42px; padding: 0 20px;">حضور</button>
                                <button type="button" class="btn btn-warning" onclick="handleQuickIdAttendance(event, 'excused')" style="white-space: nowrap; min-height: 42px; padding: 0 20px; color: #fff; background: #f59e0b; border: none; border-radius: 8px;">مستأذن</button>
                            </form>
                        </div>

                        <div style="margin-bottom: 12px;">
                            <input type="text" id="hr-students-search-input" placeholder="🔍 ابحث في طلابك بالاسم، الرقم التعريفي، أو رقم الجلوس..." oninput="filterHrStudentsTable()" style="width: 100%; font-size: 0.85rem;">
                        </div>

                        <div class="table-responsive" style="margin-bottom: 14px;">
                            <table>
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th data-i18n="th_name">اسم الطالب</th>
                                        <th data-i18n="label_seat_no">رقم الجلوس</th>
                                        <th data-i18n="th_attendance_check">حالة الحضور</th>
                                    </tr>
                                </thead>
                                <tbody id="hr-students-table">
                                    <tr><td colspan="3" style="text-align: center; color: var(--text-muted);">جاري التحميل...</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <button class="btn btn-outline" style="width: 100%; justify-content: center; margin-top: 8px; color: var(--accent-cyan); border-color: var(--accent-cyan);" onclick="exportHrAttendanceSheet()">
                            📥 تصدير غياب السيشن شيت إكسيل (Export Session Excel)
                        </button>
                    </div>

                </div>
            </div>
