<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>CodeGuard LMS - Smart Learning Management System</title>
    <link rel="icon" type="image/jpeg" href="/logo2.jpeg">
    <!-- Google Fonts: Cairo & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Header -->
    <div id="header-container"></div>

    <!-- Main Container -->
    <div class="container">

        <!-- LOGIN VIEW -->
        <div id="login-container"></div>
        <!-- MODALS -->
        <div id="modals-container"></div>
        <!-- DASHBOARD APP CONTAINER -->
        <div id="app-dashboard" style="display: none;">
            <!-- DASHBOARD NAV & TABS -->
            <div id="dashboard-nav-container"></div>
            <!-- STUDENT VIEW -->
            <div id="student-container"></div>
            <!-- HR VIEW -->
            <div id="hr-container"></div>
            <!-- MEDIA VIEW -->
            <div id="media-container"></div>
            <!-- SUPPORTER VIEW -->
            <div id="supporter-container"></div>
            <!-- INSTRUCTOR VIEW -->
            <div id="instructor-container"></div>
            <!-- ADMIN VIEW -->
            <div id="admin-container"></div>
            <!-- CHEATING VIEW -->
            <div id="cheating-container"></div>
        </div>
        <script src="/js/component-loader.js"></script>
    <script>
        // Load components before initializing app main logic
        document.addEventListener('DOMContentLoaded', () => {
            loadComponents().then(() => {
                // Now load main app script dynamically to ensure elements exist
                const script = document.createElement('script');
                script.src = '/js/app.js';
                document.body.appendChild(script);
            });
        });
    </script>
    <!-- Global Footer with Powered by Marwan Sobhy Credit -->
    <footer style="text-align: center; padding: 18px 24px; font-size: 0.9rem; color: var(--text-muted); border-top: 1px solid var(--border-card); margin-top: 50px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);">
        <div style="display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;">
            <img src="/logo.jpeg" alt="Logo" style="width: 24px; height: 24px; border-radius: 6px; object-fit: cover;">
            <span style="font-weight: 600; color: var(--text-main);">CodeGuard LMS &copy; 2026</span>
            <span style="opacity: 0.5;">•</span>
            <strong style="color: var(--accent-cyan); font-size: 0.95rem;"></strong>
        </div>
        <H1></H1>
    </footer>
</body>
</html>
